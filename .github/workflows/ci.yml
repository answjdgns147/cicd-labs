name: CI

on:
  push:
    branches: [main]

jobs:
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan
        continue-on-error: true
        run: semgrep scan --config auto --error

  codeql:
    needs: sast
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  secrets:
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build:
    needs: [sca, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cicd-labs:${{ github.sha }} .

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: cicd-labs:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cicd-labs:${{ github.sha }}
          cache: "false"
          cache-dir: ${{ runner.temp }}/trivy-cache-${{ github.run_id }}-${{ github.run_attempt }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag cicd-labs:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Update image tag in k8s/deployment.yaml
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          sed -i -E "s|(image: )${IMAGE}:[^[:space:]]+|\1${IMAGE}:${GITHUB_SHA}|" k8s/deployment.yaml
          grep -q "image: ${IMAGE}:${GITHUB_SHA}" k8s/deployment.yaml
          git diff k8s/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi
          git commit -m "Update image tag to ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
