name: Build and Push to dev ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPO: cicd-labs

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS 자격증명 - prod (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::739871967464:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS 자격증명 - dev (체이닝)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::535203104185:role/cross-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: 체이닝 확인
        run: aws sts get-caller-identity

      - name: ECR 로그인 (dev)
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: docker build -t $REGISTRY/$ECR_REPO:$TAG -t $REGISTRY/$ECR_REPO:latest .

      - name: Trivy 취약점 스캔
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: ECR 푸시
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$ECR_REPO:$TAG
          docker push $REGISTRY/$ECR_REPO:latest
