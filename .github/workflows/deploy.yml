name: AWS 배포 테스트

on:
  push:
    branches: [main]      # main에 push하면 실행
  workflow_dispatch:       # 수동 실행도 가능

permissions:
  id-token: write          # OIDC 토큰 발급 (필수!)
  contents: read

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: AWS 자격증명 받기 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::739871967464:role/github-actions-deploy
          aws-region: ap-northeast-2

      - name: 인증 확인
        run: aws sts get-caller-identity
